services:
  code-server:
    image: ghcr.io/ezazulhaq/custom-code-server:latest
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - code-server-home:/home/coder
      - ${WORKSPACE}:/home/coder/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA:-/mnt/data/docker}:/mnt/data/docker
    environment:
      - PASSWORD=${PASSWORD}
      - TZ=${TZ}
      - DOCKER_CONFIG=/home/coder/.docker
      - DOCKER_DATA=${DOCKER_DATA:-/mnt/data/docker}
    user: "1001:1001"
    group_add:
      - 988
    command: /home/coder/workspace

volumes:
  code-server-home:
